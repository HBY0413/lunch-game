name: 午餐自動排程

on:
  schedule:
    # GitHub 的排程用 UTC 時間；台北時間 = UTC + 8
    - cron: '40 2 * * 1-5'   # 台北 10:40：更新附近店名禁用字
    - cron: '50 3 * * 1-5'   # 台北 11:50：開票並選店
  workflow_dispatch:
    inputs:
      mode:
        description: '要執行什麼'
        type: choice
        options: [pick, prepare]
        default: pick
      force:
        description: '今天已經有結果也重新選'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 執行
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFICE_LAT: ${{ vars.OFFICE_LAT }}
          OFFICE_LNG: ${{ vars.OFFICE_LNG }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ "${{ inputs.force }}" = "true" ] && EXTRA="--force"
          elif [ "${{ github.event.schedule }}" = "40 2 * * 1-5" ]; then
            MODE=prepare
          else
            MODE=pick
          fi
          node picker/pick.mjs "$MODE" $EXTRA
